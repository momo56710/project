<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Admin</title>
<style>
  :root {
    --bg: #f4f5f9; --panel: #fff; --text: #1d2130; --muted: #6b7280; --border: #e5e7ee;
    --primary: #4f46e5; --primary-d: #4338ca; --danger: #dc2626; --ok: #16a34a; --warn: #d97706;
    --shadow: 0 1px 3px rgba(20,24,40,.08), 0 6px 16px rgba(20,24,40,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11131a; --panel: #1a1d27; --text: #e8eaf2; --muted: #9aa0b4; --border: #2a2e3d; --shadow: 0 1px 3px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
  aside { width: 230px; background: var(--panel); border-right: 1px solid var(--border); padding: 20px 14px; position: sticky; top: 0; height: 100vh; flex-shrink: 0; }
  aside h1 { font-size: 18px; margin: 0 8px 20px; display: flex; align-items: center; gap: 8px; }
  aside h1 span { background: var(--primary); color: #fff; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 16px; }
  nav button { display: flex; width: 100%; align-items: center; gap: 10px; background: none; border: 0; color: var(--muted); padding: 10px 12px; border-radius: 8px; font: inherit; cursor: pointer; text-align: left; }
  nav button:hover { background: var(--bg); color: var(--text); }
  nav button.active { background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); font-weight: 600; }
  nav .count { margin-left: auto; font-size: 12px; background: var(--bg); padding: 1px 8px; border-radius: 10px; color: var(--muted); }
  main { flex: 1; padding: 28px 32px; min-width: 0; }
  header.top { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  header.top h2 { margin: 0; font-size: 24px; }
  header.top .spacer { flex: 1; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--primary) 40%, transparent); border-color: var(--primary); }
  input[type=checkbox] { width: auto; }
  #search { width: 240px; }
  .btn { font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--primary-d); }
  .btn.danger { color: var(--danger); }
  .btn.sm { padding: 4px 10px; font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td.wrap { white-space: normal; min-width: 200px; max-width: 360px; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.actions { text-align: right; }
  td.actions .btn + .btn { margin-left: 6px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; background: var(--bg); color: var(--muted); text-transform: capitalize; }
  .badge.green { background: #16a34a22; color: var(--ok); } .badge.red { background: #dc262622; color: var(--danger); }
  .badge.amber { background: #d9770622; color: var(--warn); } .badge.blue { background: #4f46e522; color: var(--primary); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .product { overflow: hidden; display: flex; flex-direction: column; }
  .product .img { aspect-ratio: 4/3; background: linear-gradient(135deg, #c7d2fe, #e9d5ff); display: grid; place-items: center; font-size: 42px; overflow: hidden; }
  .product .img img { width: 100%; height: 100%; object-fit: cover; }
  .product .body { padding: 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .product h3 { margin: 0; font-size: 16px; }
  .product .price { font-size: 18px; font-weight: 700; color: var(--primary); }
  .product .meta { color: var(--muted); font-size: 13px; display: flex; gap: 6px; flex-wrap: wrap; }
  .product .foot { display: flex; gap: 6px; padding: 0 16px 14px; }
  .empty, .loading { padding: 48px; text-align: center; color: var(--muted); }
  .overlay { position: fixed; inset: 0; background: rgba(10,12,20,.55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .overlay.open { display: flex; }
  .modal { width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; padding: 24px; }
  .modal h3 { margin: 0 0 16px; font-size: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
  .field label.check { display: flex; gap: 8px; align-items: center; color: var(--text); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .item-row { display: grid; grid-template-columns: 1fr 70px 90px 32px; gap: 8px; margin-bottom: 8px; align-items: center; }
  .modal .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  #toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }
  .toast { background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px; box-shadow: var(--shadow); max-width: 340px; }
  .toast.err { background: var(--danger); color: #fff; }
  .detail { font-size: 13px; color: var(--muted); }
  @media (max-width: 760px) {
    body { flex-direction: column; }
    aside { width: 100%; height: auto; position: static; padding: 12px; border-right: 0; border-bottom: 1px solid var(--border); }
    aside h1 { margin-bottom: 10px; }
    nav { display: flex; overflow-x: auto; gap: 4px; }
    nav button { width: auto; white-space: nowrap; }
    nav .count { display: none; }
    main { padding: 18px 14px; }
    #search { width: 100%; }
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<aside>
  <h1><span>🛍</span> Store Admin</h1>
  <nav id="nav"></nav>
</aside>
<main>
  <header class="top">
    <h2 id="title"></h2>
    <div class="spacer"></div>
    <input id="search" type="search" placeholder="Search…">
    <button class="btn primary" id="addBtn">+ Add</button>
  </header>
  <div id="content"></div>
</main>

<div class="overlay" id="overlay">
  <form class="card modal" id="form" autocomplete="off">
    <h3 id="modalTitle"></h3>
    <div id="fields"></div>
    <div class="buttons">
      <button type="button" class="btn" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</div>
<div id="toasts"></div>

<script>
const STATUS_COLORS = { pending: 'amber', confirmed: 'blue', preparing: 'blue', shipped: 'blue', delivered: 'green', cancelled: 'red' };
const ROLE_COLORS = { admin: 'red', employee: 'blue', client: '' };
const money = n => '$' + Number(n || 0).toFixed(2);
const date = d => d ? new Date(d).toLocaleString() : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const badge = (text, color = '') => `<span class="badge ${color}">${esc(text)}</span>`;

// One entry per API resource: endpoint, form fields, and how to render rows.
const RESOURCES = {
  products: {
    label: 'Products', icon: '📦', api: '/api/products', view: 'cards',
    fields: [
      { key: 'name', label: 'Name', required: true },
      { key: 'description', label: 'Description', type: 'textarea' },
      { row: [
        { key: 'price', label: 'Price', type: 'number', step: '0.01', min: 0, required: true },
        { key: 'stock', label: 'Stock', type: 'number', min: 0, required: true, value: 0 } ] },
      { key: 'category', label: 'Category', type: 'select', optionsFrom: 'category', required: true },
      { row: [ { key: 'size', label: 'Size' }, { key: 'color', label: 'Color' } ] },
      { key: 'image', label: 'Image URL', type: 'url' },
    ],
    card: p => `
      <div class="img">${p.image ? `<img src="${esc(p.image)}" alt="" onerror="this.remove()">` : '📦'}</div>
      <div class="body">
        <h3>${esc(p.name)}</h3>
        <div class="price">${money(p.price)}</div>
        <div class="meta">${badge(p.category, 'blue')}${p.size ? badge(p.size) : ''}${p.color ? badge(p.color) : ''}</div>
        <div class="detail">${esc(p.description || '')}</div>
        <div>${p.stock > 0 ? badge(p.stock + ' in stock', p.stock < 5 ? 'amber' : 'green') : badge('Out of stock', 'red')}</div>
      </div>`,
  },
  category: {
    label: 'Categories', icon: '🏷', api: '/api/category',
    fields: [
      { key: 'name', label: 'Name', required: true },
      { key: 'description', label: 'Description', type: 'textarea' },
    ],
    columns: [
      ['Name', c => `<strong>${esc(c.name)}</strong>`],
      ['Description', c => esc(c.description), 'wrap'],
      ['Created', c => date(c.createdAt)],
    ],
  },
  users: {
    label: 'Users', icon: '👤', api: '/api/users',
    fields: [
      { key: 'name', label: 'Full name', required: true },
      { row: [ { key: 'username', label: 'Username', required: true }, { key: 'email', label: 'Email', type: 'email', required: true } ] },
      { key: 'password', label: 'Password', type: 'password', requiredOnCreate: true, hint: 'Leave blank to keep the current password' },
    ],
    columns: [
      ['Name', u => `<strong>${esc(u.name)}</strong>`],
      ['Username', u => esc(u.username)],
      ['Email', u => esc(u.email)],
      ['Role', u => badge(u.role || 'client', ROLE_COLORS[u.role || 'client'])],
      ['Joined', u => date(u.createdAt)],
    ],
  },
  order: {
    label: 'Orders', icon: '🧾', api: '/api/order',
    fields: [
      { row: [ { key: 'customerName', label: 'Customer name', required: true }, { key: 'customerPhone', label: 'Phone', type: 'tel', required: true } ] },
      { key: 'deliveryAddress', label: 'Delivery address', required: true },
      { key: 'products', label: 'Items', type: 'items' },
      { key: 'status', label: 'Status', type: 'select', options: ['pending', 'confirmed', 'preparing', 'shipped', 'delivered', 'cancelled'], value: 'pending' },
    ],
    columns: [
      ['Customer', o => `<strong>${esc(o.customerName)}</strong><div class="detail">${esc(o.customerPhone)}</div>`],
      ['Items', o => (o.products || []).map(i => `${i.quantity}× ${esc(i.product?.name || 'deleted product')}`).join('<br>') || '—'],
      ['Total', o => `<strong>${money(o.totalPrice)}</strong>`],
      ['Status', o => badge(o.status, STATUS_COLORS[o.status])],
      ['Address', o => esc(o.deliveryAddress), 'wrap'],
      ['Placed', o => date(o.createdAt)],
    ],
  },
  notifications: {
    label: 'Notifications', icon: '🔔', api: '/api/notifications',
    fields: [
      { key: 'title', label: 'Title', required: true },
      { key: 'message', label: 'Message', type: 'textarea', required: true },
      { row: [
        { key: 'type', label: 'Type', type: 'select', options: ['info', 'order', 'stock'], value: 'info' },
        { key: 'user', label: 'User', type: 'select', optionsFrom: 'users', allowEmpty: true } ] },
      { key: 'isRead', label: 'Mark as read', type: 'checkbox' },
    ],
    columns: [
      ['Title', n => `<strong>${esc(n.title)}</strong>`],
      ['Message', n => esc(n.message), 'wrap'],
      ['Type', n => badge(n.type, { order: 'blue', stock: 'amber' }[n.type])],
      ['User', n => esc(n.user?.name || '—')],
      ['Status', n => n.isRead ? badge('read', 'green') : badge('unread', 'amber')],
      ['Sent', n => date(n.createdAt)],
    ],
  },
};

const state = { current: 'products', data: {}, editing: null };
const $ = id => document.getElementById(id);

async function api(method, url, body) {
  const res = await fetch(url, {
    method, headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) {
    const detail = json.errors ? Object.values(json.errors).map(e => e.message).join(', ') : '';
    throw new Error(detail || json.error || json.message || `Request failed (${res.status})`);
  }
  return json;
}

function toast(msg, err) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  $('toasts').append(t);
  setTimeout(() => t.remove(), 3500);
}

async function load(name) {
  try { state.data[name] = await api('GET', RESOURCES[name].api); }
  catch (e) { state.data[name] = state.data[name] || []; toast(`${RESOURCES[name].label}: ${e.message}`, true); }
  renderNav();
}

function renderNav() {
  $('nav').innerHTML = Object.entries(RESOURCES).map(([k, r]) =>
    `<button data-k="${k}" class="${k === state.current ? 'active' : ''}">${r.icon} ${r.label}
      <span class="count">${state.data[k]?.length ?? ''}</span></button>`).join('');
}

function render() {
  const r = RESOURCES[state.current];
  $('title').textContent = r.label;
  $('addBtn').textContent = `+ Add ${r.label.replace(/ies$/, 'y').replace(/s$/, '').toLowerCase()}`;
  const q = $('search').value.trim().toLowerCase();
  const all = state.data[state.current];
  if (!all) { $('content').innerHTML = '<div class="loading">Loading…</div>'; return; }
  const rows = all.filter(x => !q || JSON.stringify(x).toLowerCase().includes(q));
  if (!rows.length) { $('content').innerHTML = `<div class="card empty">${all.length ? 'No matches.' : `No ${r.label.toLowerCase()} yet. Add the first one!`}</div>`; return; }

  const actions = x => `<button class="btn sm" data-edit="${x._id}">Edit</button><button class="btn sm danger" data-del="${x._id}">Delete</button>`;
  if (r.view === 'cards') {
    $('content').innerHTML = `<div class="grid">${rows.map(x =>
      `<div class="card product">${r.card(x)}<div class="foot">${actions(x)}</div></div>`).join('')}</div>`;
  } else {
    $('content').innerHTML = `<div class="card table-wrap"><table><thead><tr>
      ${r.columns.map(c => `<th>${c[0]}</th>`).join('')}<th></th></tr></thead><tbody>
      ${rows.map(x => `<tr>${r.columns.map(c => `<td class="${c[2] || ''}">${c[1](x)}</td>`).join('')}<td class="actions">${actions(x)}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
}

async function show(name) {
  state.current = name;
  $('search').value = '';
  renderNav(); render();
  await load(name);
  render();
}

// ---------- form ----------
function optionsFor(f) {
  if (f.options) return f.options.map(o => ({ value: o, label: o }));
  const list = state.data[f.optionsFrom] || [];
  return list.map(o => ({ value: f.optionsFrom === 'category' ? o.name : o._id, label: o.name }));
}

function fieldHtml(f, item) {
  const v = item?.[f.key] ?? f.value ?? '';
  const req = f.required || (f.requiredOnCreate && !item) ? 'required' : '';
  const id = `f_${f.key}`;
  let input;
  if (f.type === 'select') {
    let cur = f.key === 'user' ? (item?.user?._id ?? item?.user ?? '') : v;
    const opts = optionsFor(f);
    if (cur && !opts.some(o => o.value === cur)) opts.unshift({ value: cur, label: cur });
    input = `<select id="${id}" ${req}>${f.allowEmpty || !req ? '<option value="">— none —</option>' : ''}${opts.map(o =>
      `<option value="${esc(o.value)}" ${o.value === cur ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
  } else if (f.type === 'textarea') {
    input = `<textarea id="${id}" rows="3" ${req}>${esc(v)}</textarea>`;
  } else if (f.type === 'checkbox') {
    return `<div class="field"><label class="check"><input type="checkbox" id="${id}" ${item?.[f.key] ? 'checked' : ''}> ${f.label}</label></div>`;
  } else if (f.type === 'items') {
    return `<div class="field"><label>${f.label}</label><div id="items"></div>
      <button type="button" class="btn sm" id="addItem">+ Add item</button>
      <div style="text-align:right;margin-top:8px"><strong>Total: <span id="orderTotal">$0.00</span></strong></div></div>`;
  } else {
    const val = f.type === 'password' ? '' : esc(v);
    input = `<input id="${id}" type="${f.type || 'text'}" value="${val}" ${f.step ? `step="${f.step}"` : ''} ${f.min !== undefined ? `min="${f.min}"` : ''} ${req}>`;
  }
  return `<div class="field"><label for="${id}">${f.label}${req ? ' *' : ''}</label>${input}${f.hint && item ? `<div class="detail">${f.hint}</div>` : ''}</div>`;
}

function itemRow(it = {}) {
  const prods = state.data.products || [];
  const pid = it.product?._id ?? it.product ?? '';
  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = `<select class="i-prod" required><option value="">Product…</option>${prods.map(p =>
    `<option value="${p._id}" data-price="${p.price}" ${p._id === pid ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
    <input class="i-qty" type="number" min="1" value="${it.quantity || 1}" title="Quantity">
    <input class="i-price" type="number" min="0" step="0.01" value="${it.price ?? ''}" title="Unit price" required>
    <button type="button" class="btn sm danger i-del">✕</button>`;
  $('items').append(row);
}

function orderTotal() {
  let t = 0;
  document.querySelectorAll('.item-row').forEach(r => t += (+r.querySelector('.i-qty').value || 0) * (+r.querySelector('.i-price').value || 0));
  $('orderTotal').textContent = money(t);
  return t;
}

async function openForm(item) {
  const r = RESOURCES[state.current];
  state.editing = item || null;
  // make sure dropdown sources are loaded
  const needs = new Set(r.fields.flatMap(f => f.row || [f]).map(f => f.optionsFrom || (f.type === 'items' && 'products')).filter(Boolean));
  await Promise.all([...needs].filter(n => !state.data[n]).map(load));

  $('modalTitle').textContent = `${item ? 'Edit' : 'Add'} ${r.label.replace(/ies$/, 'y').replace(/s$/, '').toLowerCase()}`;
  $('fields').innerHTML = r.fields.map(f => f.row
    ? `<div class="row2">${f.row.map(x => fieldHtml(x, item)).join('')}</div>` : fieldHtml(f, item)).join('');
  if ($('items')) {
    (item?.products?.length ? item.products : [{}]).forEach(itemRow);
    orderTotal();
  }
  $('overlay').classList.add('open');
  $('fields').querySelector('input,select,textarea')?.focus();
}

function closeForm() { $('overlay').classList.remove('open'); }

function collect() {
  const r = RESOURCES[state.current];
  const body = {};
  for (const f of r.fields.flatMap(f => f.row || [f])) {
    if (f.type === 'items') {
      body.products = [...document.querySelectorAll('.item-row')].map(row => ({
        product: row.querySelector('.i-prod').value,
        quantity: +row.querySelector('.i-qty').value,
        price: +row.querySelector('.i-price').value,
      }));
      body.totalPrice = orderTotal();
      continue;
    }
    const el = $(`f_${f.key}`);
    if (f.type === 'checkbox') body[f.key] = el.checked;
    else if (f.type === 'number') body[f.key] = el.value === '' ? undefined : +el.value;
    else if (el.value === '' && (f.type === 'password' || f.allowEmpty || !f.required)) { if (state.editing && f.type !== 'password') body[f.key] = f.key === 'user' ? null : ''; }
    else body[f.key] = el.value;
  }
  return body;
}

// ---------- events ----------
$('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.k); });
$('addBtn').onclick = () => openForm(null);
$('cancelBtn').onclick = closeForm;
$('overlay').addEventListener('mousedown', e => { if (e.target === $('overlay')) closeForm(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeForm(); });
$('search').addEventListener('input', render);

$('content').addEventListener('click', async e => {
  const edit = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
  const list = state.data[state.current];
  if (edit) openForm(list.find(x => x._id === edit.dataset.edit));
  if (del && confirm('Delete this item? This cannot be undone.')) {
    try {
      await api('DELETE', `${RESOURCES[state.current].api}/${del.dataset.del}`);
      toast('Deleted');
      await load(state.current); render();
    } catch (err) { toast(err.message, true); }
  }
});

$('fields').addEventListener('click', e => {
  if (e.target.id === 'addItem') itemRow();
  if (e.target.classList.contains('i-del')) { e.target.closest('.item-row').remove(); orderTotal(); }
});
$('fields').addEventListener('input', e => {
  if (e.target.classList.contains('i-qty') || e.target.classList.contains('i-price')) orderTotal();
});
$('fields').addEventListener('change', e => {
  if (e.target.classList.contains('i-prod')) {
    const price = e.target.selectedOptions[0]?.dataset.price;
    if (price) e.target.closest('.item-row').querySelector('.i-price').value = price;
    orderTotal();
  }
});

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const r = RESOURCES[state.current];
  if ($('items') && !document.querySelector('.item-row')) return toast('Add at least one item', true);
  try {
    const url = state.editing ? `${r.api}/${state.editing._id}` : r.api;
    await api(state.editing ? 'PUT' : 'POST', url, collect());
    toast(state.editing ? 'Saved changes' : 'Created');
    closeForm();
    await load(state.current); render();
  } catch (err) { toast(err.message, true); }
});

renderNav();
show('products');
// prefetch counts for the sidebar
Object.keys(RESOURCES).filter(k => k !== 'products').forEach(load);
</script>
</body>
</html>
